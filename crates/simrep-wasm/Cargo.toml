[package]
name = "simrep-wasm"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
threads = ["dep:wasm-bindgen-rayon"]
webgpu = ["simrep-solve/webgpu", "simrep-fly/webgpu", "dep:js-sys", "dep:wasm-bindgen-futures", "dep:serde-wasm-bindgen"]

[dependencies]
simrep-core = { path = "../../simrep/crates/simrep-core" }
simrep-io = { path = "../../simrep/crates/simrep-io", default-features = false }
simrep-solve = { path = "../../simrep/crates/simrep-solve", default-features = false }
simrep-fly = { path = "../../simrep/crates/simrep-fly", default-features = false }
simrep-gem = { path = "../../simrep/crates/simrep-gem", default-features = false }
simrep-mesh = { path = "../../simrep/crates/simrep-mesh" }
simrep-geom = { path = "../../simrep/crates/simrep-geom" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "=0.2.129"
rayon = "1.12"
web-time = "1.1.0"
base64 = "0.22"
bincode = "1.3"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = { version = "1.3", optional = true }
